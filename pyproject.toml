[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrome-in-a-box"
version = "1.4.0"
description = "Real Google Chrome in a box — a Linux container or a macOS VM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Standard library only, on purpose. The published binary bundles the interpreter,
# so there is nothing to install alongside it either.
dependencies = []

[project.urls]
Homepage = "https://github.com/sapn95/chrome-in-a-box"

[project.scripts]
cib = "cib:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14", "nuitka>=2.5"]

[tool.hatch.build.targets.wheel]
only-include = ["cib.py"]

[tool.hatch.build.targets.sdist]
include = ["cib.py", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests poke at internals and use assert, which is the point of them.
"tests/*" = ["S101", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=cib --cov-report=term-missing --cov-fail-under=80"
