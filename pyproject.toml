[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-in-a-box"
version = "3.1.0"
description = "A real, unmanaged browser in a box — a Linux container or a macOS VM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Standard library only, on purpose. The published binary bundles the interpreter,
# so there is nothing to install alongside it either.
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/sapn95/browser-in-a-box"

[project.scripts]
bib = "bib:main"

[dependency-groups]
# patchelf is here rather than passed to `uv run --with` in CI: it is a build
# input like the others, and only the lock file records which one was used.
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14", "nuitka>=2.5", "patchelf>=0.17"]

[tool.hatch.build.targets.wheel]
# packer/ too: bib tells the user BIB_VM_PACKER=1 is available, and a wheel that
# ships the patcher but not the template makes that advice a dead end.
only-include = ["bib.py", "bibbrowsers.py", "bibicon.py", "bibpatch.py", "packer"]

[tool.hatch.build.targets.sdist]
# Everything the tests read, not just the code. Shipping tests/ without the files
# they open means the tests are there and cannot run, which is the only reason to
# ship them at all.
include = [
  "bib.py",
  "bibbrowsers.py",
  "bibicon.py",
  "bibpatch.py",
  "packer",
  "tests",
  "scripts",
  "Formula",
  ".github",
  "renovate.json",
  "uv.lock",
  "README.md",
  "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests poke at internals and use assert, which is the point of them.
"tests/*" = ["S101", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bib --cov=bibpatch --cov-report=term-missing --cov-fail-under=80"
