# CodeRabbit reviews pull requests and nothing else, so anything pushed straight to
# main was never reviewed by anything. Six releases went out that way in one night.
# What stops that happening again is branch protection on main, which requires a
# pull request; this file only decides what CodeRabbit does with the ones it sees.
#
# base_branches ADDS to the default branch rather than replacing it, so main is
# covered whether or not it is named. It is named anyway, because the list read as
# a restriction until CodeRabbit itself said otherwise on the pull request that
# introduced this file.
language: en
reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  # The formula is regenerated by the release workflow from published checksums,
  # and uv.lock by uv. Reviewing either is reviewing a machine's output.
  path_filters:
    - "!Formula/bib.rb"
    - "!uv.lock"
