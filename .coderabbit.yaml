# CodeRabbit reviews pull requests, and only those whose base branch is listed
# here. Everything pushed straight to main was therefore never reviewed by
# anything — which is the reason work goes through a branch and a pull request in
# this repository, including version bumps and release commits.
language: en
reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  # The formula is regenerated by the release workflow from published checksums,
  # and uv.lock by uv. Reviewing either is reviewing a machine's output.
  path_filters:
    - "!Formula/bib.rb"
    - "!uv.lock"
