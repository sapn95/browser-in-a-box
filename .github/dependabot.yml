version: 2
# One grouped pull request per ecosystem per week. Every update merges itself
# once the checks are green — majors included; the `no-automerge` label is the
# manual hold. See .github/workflows/dependabot-auto-merge.yml for both halves
# of that, and https://github.com/sapn95/.github/blob/main/CI.md for the rest.
#
# This is the one repository here that also keeps a renovate.json, and the two
# do not overlap. Three versions are pinned inside the source rather than in a
# manifest — the kasmweb image tags in bibbrowsers.py, GUEST_AGENT_VERSION in
# bib.py, and packer-plugin-tart in packer/browser-vm.pkr.hcl — and only a regex
# manager can follow those. Dependabot has none, so Renovate keeps its three and
# Dependabot takes everything with a manifest behind it.
#
# Renovate only does that once the app is installed and granted to this
# repository. Until then its config is a contract with nobody, and the two tests
# in tests/test_bib.py that pair every `# renovate:` marker with a manager are
# what keep that contract from rotting in the meantime.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
