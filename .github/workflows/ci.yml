name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so an upstream image regression is caught even without commits.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
      - name: yamllint
        run: pipx run yamllint .
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: bats
        run: bats tests/

  smoke:
    name: smoke (real container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: start the container
        run: ./run.sh up
      - name: web UI answers, and without a login prompt
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:6901/)
          echo "HTTP $code"
          test "$code" = "200" || { echo "expected 200 (401 = login prompt is back)"; exit 1; }
      - name: Chrome is running
        run: |
          n=$(docker exec chrome-in-a-box bash -c 'pgrep -c chrome')
          echo "chrome processes: $n"
          test "$n" -gt 0
      - name: dump logs on failure
        if: failure()
        run: ./run.sh logs | tail -50
      - name: clean up
        if: always()
        run: ./run.sh down
