name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so an upstream image regression is caught even without commits.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ruff
        run: pipx run ruff check --output-format=github .
      - name: ruff format
        run: pipx run ruff format --check --diff .
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
      - name: yamllint
        run: pipx run yamllint .
      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The tool is stdlib-only, so it has to work on whatever Python is present.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: pytest
        run: pipx run pytest

  smoke:
    name: smoke (real container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pulling ~3GB and booting an emulation-free amd64 desktop still takes a while.
      CIB_WAIT_SECS: "300"
    steps:
      - uses: actions/checkout@v7
      - name: start the container
        run: ./run.sh up
      - name: web UI answers, and without a login prompt
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:6901/)
          echo "HTTP $code"
          test "$code" = "200" || { echo "expected 200 (401 = login prompt is back)"; exit 1; }
      - name: Chrome is running
        run: |
          eng=$(./run.sh engine)
          n=$("$eng" exec chrome-in-a-box bash -c 'pgrep -c chrome || true')
          echo "chrome processes: ${n:-0}"
          test "${n:-0}" -gt 0
      - name: desktop is at the requested resolution
        run: |
          eng=$(./run.sh engine)
          mode=""
          for _ in $(seq 1 10); do
            mode=$("$eng" exec -e DISPLAY=:1 chrome-in-a-box xrandr --current |
                   awk '/\*/{print $1; exit}')
            [ "$mode" = "1920x1200" ] && break
            sleep 2
          done
          test "$mode" = "1920x1200" ||
            { echo "fell back to $mode; the xrandr workaround is not applying"; exit 1; }
      - name: dump logs on failure
        if: failure()
        timeout-minutes: 2
        run: ./run.sh logs 2>&1 | tail -50 || true
      - name: clean up
        if: always()
        run: ./run.sh down
