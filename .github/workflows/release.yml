name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

concurrency:
  # Two tags pushed together would race in the tap job, and the loser publishes a
  # release whose formula was never updated.
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: version matches the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: the tag, bib.py and pyproject.toml must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bib.py)
          meta=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          echo "tag=$tag bib.py=$code pyproject=$meta"
          test "$tag" = "$code" || { echo "bib.py says $code, the tag says $tag"; exit 1; }
          test "$tag" = "$meta" || { echo "pyproject says $meta, the tag says $tag"; exit 1; }
          # uv.lock carries a third copy of the version and is committed.
          lock=$(python3 -c "import re,pathlib;print(re.search(r'name = \"browser-in-a-box\"\nversion = \"([^\"]+)\"', pathlib.Path('uv.lock').read_text()).group(1))")
          test "$tag" = "$lock" || { echo "uv.lock says $lock, the tag says $tag"; exit 1; }

  linux:
    name: binary (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Compiled inside UBI10, so the resulting ELF links against a base that is
    # actually supported, rather than whatever the runner image happens to ship.
    needs: guard
    container: registry.access.redhat.com/ubi10/ubi:10.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: build tools
        # patchelf is not in UBI10's repos (it lives in EPEL, which has no place on
        # this base). The PyPI wheel ships a statically linked binary that Nuitka
        # picks up from PATH, so it is installed with the build below instead.
        run: >
          dnf install -y --setopt=install_weak_deps=0
          git tar gzip gcc gcc-c++
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: static libatomic
        # uv's standalone CPython carries -l:libatomic.a in its link flags. Install
        # the real package if this arch has it; x86_64 needs it and arm64 links
        # without any libatomic at all, which shows nothing here actually
        # references those symbols. If the package is unavailable, an empty archive
        # satisfies the flag — and a symbol that really were needed would then fail
        # loudly as an undefined reference, not produce a broken binary.
        run: |
          if dnf install -y --setopt=install_weak_deps=0 libatomic-static; then
            echo "using the packaged static libatomic"
          else
            echo "no libatomic-static for this arch; providing an empty archive"
            : > /tmp/empty.c
            gcc -c /tmp/empty.c -o /tmp/empty.o
            ar rcs /usr/lib64/libatomic.a /tmp/empty.o
          fi
      - name: compile with Nuitka
        run: |
          uv run --locked --python "${PYTHON_VERSION}" --group dev \
            python -m nuitka \
            --standalone --remove-output --assume-yes-for-downloads \
            --include-data-dir=packer=packer \
            --output-filename=bib --output-dir=dist bib.py
          ./dist/bib.dist/bib --version
          # The patcher is compiled in, not shipped beside the binary: the build
          # re-executes itself under sudo for the one step that needs root. Proved
          # by calling the hidden entry, which only answers if the module is there.
          ./dist/bib.dist/bib __patch --help > /dev/null
          test -f ./dist/bib.dist/packer/browser-vm.pkr.hcl
      - name: package
        run: |
          # A top-level directory on purpose: this is a standalone build, ~44 files,
          # and it must not explode into whatever directory it is unpacked in.
          mv dist/bib.dist "dist/bib-linux-${{ matrix.arch }}"
          tar -czf "dist/bib-linux-${{ matrix.arch }}.tar.gz" \
            -C dist "bib-linux-${{ matrix.arch }}"
          cd dist
          sha256sum "bib-linux-${{ matrix.arch }}.tar.gz" \
            > "bib-linux-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: bib-linux-${{ matrix.arch }}
          path: dist/bib-linux-${{ matrix.arch }}.tar.gz*

  macos:
    name: binary (macos-arm64)
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: compile with Nuitka
        run: |
          uv run --locked --python "${PYTHON_VERSION}" --group dev python -m nuitka \
            --standalone --remove-output --assume-yes-for-downloads \
            --include-data-dir=packer=packer \
            --output-filename=bib --output-dir=dist bib.py
          ./dist/bib.dist/bib --version
          # This is the build that can actually run 'bib vm'. The patcher is
          # compiled in and answers on the hidden entry; the packer template is the
          # one thing still spawned from beside the binary.
          ./dist/bib.dist/bib __patch --help > /dev/null
          test -f ./dist/bib.dist/packer/browser-vm.pkr.hcl
      - name: package
        run: |
          # A top-level directory on purpose: this is a standalone build, ~44 files,
          # and it must not explode into whatever directory it is unpacked in.
          mv dist/bib.dist dist/bib-macos-arm64
          tar -czf dist/bib-macos-arm64.tar.gz -C dist bib-macos-arm64
          cd dist
          shasum -a 256 bib-macos-arm64.tar.gz > bib-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: bib-macos-arm64
          path: dist/bib-macos-arm64.tar.gz*

  publish:
    name: publish release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --repo "${GITHUB_REPOSITORY}"

  tap:
    name: update the Homebrew formula
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: rewrite Formula/bib.rb with the published checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha() { cut -d' ' -f1 < "dist/bib-$1.tar.gz.sha256"; }
          python3 scripts/update_formula.py "$version" Formula/bib.rb \
            "macos-arm64=$(sha macos-arm64)" \
            "linux-arm64=$(sha linux-arm64)" \
            "linux-x86_64=$(sha linux-x86_64)"
          git diff --stat
      - name: commit, through a pull request like everything else
        # main takes no direct pushes, this job included. Six releases went out
        # unreviewed because they did not go through one, so the rule holds for the
        # workflow too — it opens a PR and merges it rather than being an exception.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The repository owner, not github-actions[bot]. GitHub builds the
          # contributor list out of the commit authors on the default branch, so
          # committing as the bot put a machine account on the front page of a
          # one-person project, once per release and forever.
          git config user.name "Sebastian Winterberger"
          git config user.email "sapn95@users.noreply.github.com"
          branch="formula/${GITHUB_REF_NAME}"
          git checkout -b "$branch"
          git add Formula/bib.rb
          git commit -m "chore: point the Homebrew formula at ${GITHUB_REF_NAME}" || exit 0
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: point the Homebrew formula at ${GITHUB_REF_NAME}" \
            --body "Checksums of the assets published for ${GITHUB_REF_NAME}, written by scripts/update_formula.py."
          gh pr merge "$branch" --rebase --delete-branch
      - name: send the same formula to the tap
        # The README says `brew install sapn95/tap/bib`, and that tap is a separate
        # repository. Rewriting the copy here and stopping left sapn95/homebrew-tap
        # on 1.4.0 while two major releases went out, still pointing at a repository
        # name that no longer exists — so `brew upgrade` never moved anyone.
        #
        # Needs a token with contents:write on the tap. Without one this is a no-op
        # that says so, rather than a red release for a formula copy.
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::TAP_TOKEN is not set, so sapn95/homebrew-tap still" \
                 "points at whatever it pointed at before this release."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/sapn95/homebrew-tap.git" tap
          cp Formula/bib.rb tap/Formula/bib.rb
          # The old name published from this same repository. Left behind it would
          # keep serving 1.4.0 to anyone who typed the old command.
          rm -f tap/Formula/cib.rb
          cd tap
          git config user.name "Sebastian Winterberger"
          git config user.email "sapn95@users.noreply.github.com"
          git add -A Formula
          git commit -m "bib ${GITHUB_REF_NAME#v}" || exit 0
          git push origin HEAD
